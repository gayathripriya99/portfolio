    <script>
      // Apply saved preferences before first paint. Without the "motion" class every element renders in its final state.
      (function () {
        var root = document.documentElement
        function get(k) { try { return localStorage.getItem('priyaos:' + k) } catch (e) { return null } }
        root.dataset.theme = get('theme') === 'light' ? 'light' : 'dark'
        try {
          var sysReduce = matchMedia('(prefers-reduced-motion: reduce)').matches
          if (get('motion') !== 'reduced' && !sysReduce && 'IntersectionObserver' in window) root.classList.add('motion')
        } catch (e) {}
        var mode = new URLSearchParams(location.search).get('mode')
        if (mode === 'recruiter' || (mode !== 'full' && get('recruiter') === 'on')) root.dataset.recruiter = 'on'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>

    </noscript>

  </body>
